<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>业主大人</title>
<style>
* { box-sizing: border-box; }
html, body {
  overscroll-behavior: none;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
body { margin: 0; background: #f3f3f3; color: #111; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 14px; }
.app { max-width: 1560px; margin: 0 auto; padding: 18px; display: flex; flex-direction: column; gap: 16px; min-height: 100vh; }
header.panel { background: #f6f6f6; border: 1px solid #d8d8d8; padding: 14px 20px; display: flex; align-items: baseline; gap: 12px; }
header.panel h1 { font-size: 23px; margin: 0; letter-spacing: .5px; }
header.panel .subtitle { font-size: 11px; color: #4d4d4d; letter-spacing: 1px; text-transform: uppercase; margin-left: auto; }
.content { display: grid; grid-template-columns: minmax(380px, 1fr) minmax(460px, 1.25fr); gap: 16px; align-items: start; }
.left, .right { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.group { background: #fff; border: 1px solid #d9d9d9; padding: 14px 16px 16px; }
.group > h2 { font-size: 14px; margin: -14px -16px 12px; padding: 9px 16px; background: #fbfbfb; border-bottom: 1px solid #e5e5e5; }
.btn { background: #1f1f1f; color: #f5f5f5; border: 1px solid #424242; padding: 9px 14px; font-weight: 600; min-height: 40px; border-radius: 0; cursor: pointer; font-size: 14px; font-family: inherit; touch-action: manipulation; }
.btn:hover:not(:disabled) { background: #424242; }
.btn.secondary { background: #f3f3f3; color: #1c1c1c; border-color: #d9d9d9; }
.btn.secondary:hover:not(:disabled) { background: #d9d9d9; }
.btn.success { background: #2f2f2f; color: #fff; border-color: #4a4a4a; }
.btn.success:hover:not(:disabled) { background: #4a4a4a; }
.btn.warn { background: #ededed; color: #1a1a1a; border-color: #d4d4d4; }
.btn.warn:hover:not(:disabled) { background: #d4d4d4; }
.btn:disabled { background: #e6e6e6; color: #8a8a8a; border-color: #d3d3d3; cursor: not-allowed; }
.btn-row { display: flex; gap: 8px; margin-bottom: 8px; }
.btn-row:last-child { margin-bottom: 0; }
.btn-row .btn { flex: 1; }
.param-row { display: flex; align-items: center; gap: 12px; padding: 6px 8px; }
.param-row label { width: 180px; font-weight: 600; font-size: 13px; flex-shrink: 0; }
.param-row input[type=range] { flex: 1; accent-color: #1f1f1f; height: 28px; }
.param-row input[type=number] { width: 72px; padding: 7px 8px; border: 1px solid #cfcfcf; font-family: inherit; font-size: 16px; }
.check-row { padding: 8px 8px 2px; display: flex; align-items: center; gap: 8px; font-weight: 500; }
.check-row input { accent-color: #1f1f1f; width: 20px; height: 20px; }
.dropzone { border: 1px dashed #b9b9b9; background: #f7f7f7; min-height: 150px; display: flex; align-items: center; justify-content: center; color: #505050; font-size: 13px; text-align: center; cursor: pointer; overflow: hidden; padding: 6px; }
.dropzone.dragover { border-color: #1f1f1f; background: #efefef; }
.dropzone img { max-width: 100%; max-height: 280px; }
.load-row { display: flex; gap: 8px; margin-bottom: 10px; }
.load-row .btn { flex: 1; }
#cropInfo { font-weight: bold; font-size: 13px; margin-bottom: 8px; }
#cropGroup .btn { width: 100%; margin-bottom: 8px; }
#cropGroup .btn:last-child { margin-bottom: 0; }
.preview-top { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
#previewStatus { flex: 1; min-width: 140px; text-align: center; background: #f5f5f5; border: 1px solid #d7d7d7; padding: 7px 10px; font-weight: 600; font-size: 13px; color: #222; }
.icon-btn { width: 40px; min-height: 40px; padding: 0; flex: 0 0 40px; }
#zoomRange { width: 140px; accent-color: #1f1f1f; }
#zoomLabel { width: 48px; text-align: center; font-size: 12px; font-weight: 600; color: #333; }
#previewScroll { height: 480px; overflow: auto; border: 1px solid #d9d9d9; background: #fff; overscroll-behavior: contain; }
#previewWrap { position: relative; display: inline-block; line-height: 0; }
#plan {
  display: block;
  background: #fff;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
#cropOverlay { position: absolute; border: 2px solid green; background: rgba(0,255,0,0.12); display: none; pointer-events: none; }
.edit-group { margin-top: 14px; border-top: 1px solid #e5e5e5; padding-top: 12px; }
.row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.row label { font-weight: 600; font-size: 13px; flex-shrink: 0; }
#targetInput { flex: 1; min-width: 110px; padding: 8px; border: 1px solid #cfcfcf; font-family: inherit; font-size: 16px; }
#targetSwatch { width: 28px; height: 28px; border: 1px solid #888; background: #fff; flex-shrink: 0; }
#targetInfo { color: #666; font-size: 12px; margin-bottom: 8px; }
#btnUndo { width: 100%; }
footer#statusBar {
  position: sticky; bottom: 0; background: #fff; border: 1px solid #d9d9d9;
  padding: 9px 14px; padding-bottom: max(9px, env(safe-area-inset-bottom));
  font-size: 13px; color: #333; box-shadow: 0 -2px 6px rgba(0,0,0,.04);
}
.hidden-file { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; left: -9999px; }

/* ============ 响应式：平板 & 手机 ============ */
@media (max-width: 980px) {
  .content { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .app { padding: 10px; gap: 10px; }
  header.panel { padding: 12px 14px; flex-direction: column; align-items: flex-start; gap: 4px; }
  header.panel h1 { font-size: 20px; }
  header.panel .subtitle { margin-left: 0; font-size: 10px; }
  .group { padding: 12px 12px 14px; }
  .group > h2 { margin: -12px -12px 10px; padding: 9px 12px; }
  .param-row { flex-wrap: wrap; padding: 6px 4px; gap: 6px 10px; }
  .param-row label { width: 100%; margin-bottom: 2px; font-size: 13px; }
  .param-row input[type=range] { flex: 1 1 auto; min-width: 0; }
  .param-row input[type=number] { flex: 0 0 80px; }
  #previewScroll { height: 56vh; min-height: 300px; max-height: 70vh; }
  #zoomRange { width: 90px; }
  .btn-row { flex-wrap: wrap; }
  .btn-row .btn { flex: 1 1 45%; min-width: 0; }
  .dropzone { min-height: 120px; }
  .dropzone img { max-height: 200px; }
  footer#statusBar { padding: 8px 12px; padding-bottom: max(8px, env(safe-area-inset-bottom)); font-size: 12px; }
}
</style>
</head>
<body>
<div class="app">
  <header class="panel">
    <h1>业主大人</h1>
    <span class="subtitle">业主大人专属</span>
  </header>
  <div class="content">
    <div class="left">
      <div class="group" id="loadGroup">
        <h2>加载图片</h2>
        <div class="load-row">
          <button class="btn" id="btnOpen" type="button">打开图片</button>
          <button class="btn secondary" id="btnClear" type="button">清除图片</button>
        </div>
        <div class="dropzone" id="dropZone">拖拽图片到此处<br>（或点击选择文件）</div>
        <input type="file" id="fileInput" accept="image/*" class="hidden-file">
      </div>

      <div class="group">
        <h2>参数设置</h2>
        <div class="param-row">
          <label for="colorRange">最大颜色数:</label>
          <input type="range" id="colorRange" min="2" max="64" value="16">
          <input type="number" id="colorNum" min="2" max="64" value="16">
        </div>
        <div class="param-row">
          <label for="widthRange">图纸宽度:</label>
          <input type="range" id="widthRange" min="10" max="200" value="40">
          <input type="number" id="widthNum" min="10" max="200" value="40">
        </div>
        <div class="param-row">
          <label for="heightRange">图纸高度:</label>
          <input type="range" id="heightRange" min="10" max="200" value="40">
          <input type="number" id="heightNum" min="10" max="200" value="40">
        </div>
        <div class="check-row">
          <input type="checkbox" id="aspectChk">
          <label for="aspectChk">等比例缩放（保持原图宽高比）</label>
        </div>
      </div>

      <div class="group" id="cropGroup">
        <h2>裁剪边缘</h2>
        <div id="cropInfo">当前尺寸: 无</div>
        <button class="btn" id="btnCropMode" type="button">启用裁剪</button>
        <button class="btn success" id="btnApplyCrop" type="button" style="display:none">应用裁剪</button>
        <button class="btn warn" id="btnCancelCrop" type="button" style="display:none">取消裁剪</button>
      </div>

      <div class="group">
        <h2>生成与保存</h2>
        <div class="btn-row">
          <button class="btn success" id="btnGenerate" type="button" style="flex:3">生成图纸</button>
          <button class="btn warn" id="btnReset" type="button">重置参数</button>
        </div>
        <div class="btn-row">
          <button class="btn" id="btnSavePng" type="button" disabled>保存 PNG</button>
          <button class="btn" id="btnSaveTxt" type="button" disabled>保存颜色清单</button>
          <button class="btn secondary" id="btnSaveSolid" type="button" disabled>保存实体图</button>
        </div>
        <div class="btn-row">
          <button class="btn" id="btnPdf" type="button" disabled>导出 PDF</button>
          <button class="btn" id="btnSvg" type="button" disabled>导出 SVG</button>
          <button class="btn secondary" id="btnPrint" type="button" disabled>打印</button>
        </div>
      </div>
    </div>

    <div class="right">
      <div class="group">
        <h2>预览结果</h2>
        <div class="preview-top">
          <div id="previewStatus">等待生成</div>
          <button class="btn secondary icon-btn" id="btnZoomOut" type="button">-</button>
          <input type="range" id="zoomRange" min="30" max="200" step="5" value="100">
          <span id="zoomLabel">100%</span>
          <button class="btn secondary icon-btn" id="btnZoomIn" type="button">+</button>
          <button class="btn" id="btnMirror" type="button" disabled>水平镜像</button>
          <div class="check-row" style="padding:0">
            <input type="checkbox" id="solidChk">
            <label for="solidChk" style="font-size:12px">实体图预览</label>
          </div>
        </div>
        <div id="previewScroll">
          <div id="previewWrap">
            <canvas id="plan" width="10" height="10"></canvas>
            <div id="cropOverlay"></div>
          </div>
        </div>

        <div class="edit-group" id="editGroup" style="opacity:.5; pointer-events:none;">
          <div class="check-row" style="padding:0 0 8px;">
            <input type="checkbox" id="editModeChk">
            <label for="editModeChk">改色模式（涂抹改色 / 拖拽缩放）</label>
          </div>
          <div class="row">
            <label for="targetInput">目标色号:</label>
            <input id="targetInput" list="mardIds" placeholder="输入或选择色号，如 A1" value="[空]">
            <datalist id="mardIds"></datalist>
            <div id="targetSwatch"></div>
          </div>
          <div id="targetInfo">空（无豆子）</div>
          <button class="btn warn" id="btnUndo" type="button" disabled>撤销</button>
        </div>
      </div>
    </div>
  </div>
  <footer id="statusBar">就绪</footer>
</div>

],["M6",176,167,130],["M7",180,164,151],["M8",179,130,129],["M9",165,135,103],["M10",197,178,188],["M11",159,117,148],["M12",100,71,73],["M13",209,144,102],["M14",199,115,98],["M15",117,125,120]];
const MARD_COLORS = MARD221_FULL.map(d => [d[1], d[2], d[3]]);
const MARD_NAMES = MARD221_FULL.map(d => d[0]);
const MARD_ID_TO_IDX = {}; MARD221_FULL.forEach((d, i) => MARD_ID_TO_IDX[d[0]] = i);

/* ================= 通用工具 ================= */
function $(id) { return document.getElementById(id); }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function luminance(rgb) { return 0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2]; }
function rgbStr(c) { return "rgb(" + c[0] + "," + c[1] + "," + c[2] + ")"; }
function setStatus(msg) { $("statusBar").textContent = msg; }
function isTouchDevice() { return ("ontouchstart" in window) || (navigator.maxTouchPoints > 0); }

/* ================= 颜色处理 ================= */
const DELTA = 6 / 29, DELTA3 = DELTA * DELTA * DELTA;
function rgbToLab(r, g, b, out, oi) {
  r /= 255; g /= 255; b /= 255;
  r = r <= 0.04045 ? r / 12.92 : Math.pow((r + 0.055) / 1.055, 2.4);
  g = g <= 0.04045 ? g / 12.92 : Math.pow((g + 0.055) / 1.055, 2.4);
  b = b <= 0.04045 ? b / 12.92 : Math.pow((b + 0.055) / 1.055, 2.4);
  const X = r * 0.4124564 + g * 0.3575761 + b * 0.1804375;
  const Y = r * 0.2126729 + g * 0.7151522 + b * 0.0721750;
  const Z = r * 0.0193339 + g * 0.1191920 + b * 0.9503041;
  const fx = fLab(X / 0.95047), fy = fLab(Y / 1.0), fz = fLab(Z / 0.94583);
  out[oi] = 116 * fy - 16;
  out[oi + 1] = 500 * (fx - fy);
  out[oi + 2] = 200 * (fy - fz);
}
function fLab(t) { return t > DELTA3 ? Math.cbrt(t) : t / (3 * DELTA * DELTA) + 4 / 29; }

let _mardLab = null;
function mardLabArray() {
  if (_mardLab) return _mardLab;
  _mardLab = new Float32Array(MARD_COLORS.length * 3);
  MARD_COLORS.forEach((c, i) => rgbToLab(c[0], c[1], c[2], _mardLab, i * 3));
  return _mardLab;
}

function kmeans(X, n, k, seed) {
  const rnd = mulberry32(seed == null ? 42 : seed);
  const chosen = new Set();
  while (chosen.size < k) chosen.add(Math.floor(rnd() * n) % n);
  const centers = new Float32Array(k * 3);
  let ci = 0;
  chosen.forEach(i => { centers[ci * 3] = X[i * 3]; centers[ci * 3 + 1] = X[i * 3 + 1]; centers[ci * 3 + 2] = X[i * 3 + 2]; ci++; });
  const assign = new Int32Array(n);
  const sums = new Float64Array(k * 3), cnts = new Int32Array(k);
  const maxIter = 100, tol = 1e-4;
  for (let iter = 0; iter < maxIter; iter++) {
    for (let i = 0; i < n; i++) {
      const x0 = X[i * 3], x1 = X[i * 3 + 1], x2 = X[i * 3 + 2];
      let best = 0, bd = Infinity;
      for (let c = 0; c < k; c++) {
        const d0 = x0 - centers[c * 3], d1 = x1 - centers[c * 3 + 1], d2 = x2 - centers[c * 3 + 2];
        const d = d0 * d0 + d1 * d1 + d2 * d2;
        if (d < bd) { bd = d; best = c; }
      }
      assign[i] = best;
    }
    sums.fill(0); cnts.fill(0);
    for (let i = 0; i < n; i++) {
      const a = assign[i];
      sums[a * 3] += X[i * 3]; sums[a * 3 + 1] += X[i * 3 + 1]; sums[a * 3 + 2] += X[i * 3 + 2];
      cnts[a]++;
    }
    let shift = 0;
    for (let c = 0; c < k; c++) {
      if (cnts[c] > 0) {
        for (let j = 0; j < 3; j++) {
          const nc = sums[c * 3 + j] / cnts[c];
          shift += (nc - centers[c * 3 + j]) * (nc - centers[c * 3 + j]);
          centers[c * 3 + j] = nc;
        }
      }
    }
    if (Math.sqrt(shift) < tol) break;
  }
  return { assign, centers };
}

function processImageToMard(imgEl, targetW, targetH, k) {
  const oc = document.createElement("canvas");
  oc.width = targetW; oc.height = targetH;
  const octx = oc.getContext("2d", { willReadFrequently: true });
  octx.imageSmoothingEnabled = true;
  octx.imageSmoothingQuality = "high";
  octx.drawImage(imgEl, 0, 0, targetW, targetH);
  const data = octx.getImageData(0, 0, targetW, targetH).data;
  const n = targetW * targetH;
  const lab = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) rgbToLab(data[i * 4], data[i * 4 + 1], data[i * 4 + 2], lab, i * 3);

  const { assign, centers } = kmeans(lab, n, k, 42);
  const mardLab = mardLabArray(), m = MARD_COLORS.length;
  const centerMap = new Int32Array(k);
  for (let c = 0; c < k; c++) {
    let best = 0, bd = Infinity;
    for (let j = 0; j < m; j++) {
      const d0 = centers[c * 3] - mardLab[j * 3], d1 = centers[c * 3 + 1] - mardLab[j * 3 + 1], d2 = centers[c * 3 + 2] - mardLab[j * 3 + 2];
      const d = d0 * d0 + d1 * d1 + d2 * d2;
      if (d < bd) { bd = d; best = j; }
    }
    centerMap[c] = best;
  }
  const grid = new Int16Array(n);
  const counts = {};
  for (let i = 0; i < n; i++) {
    const idx = centerMap[assign[i]];
    grid[i] = idx;
    counts[idx] = (counts[idx] || 0) + 1;
  }
  return { grid, w: targetW, h: targetH, counts };
}

function recountColors(grid, w, h) {
  const counts = {};
  for (let i = 0; i < w * h; i++) {
    const idx = grid[i];
    if (idx === -1) continue;
    counts[idx] = (counts[idx] || 0) + 1;
  }
  return counts;
}

/* Bresenham 直线插值（修复：步进方向） */
function lineCellsBetween(r0, c0, r1, c1) {
  const cells = [];
  const dr = Math.abs(r1 - r0), dc = Math.abs(c0 - c1);
  const sr = r0 < r1 ? 1 : -1, sc = c0 < c1 ? 1 : -1;
  let err = dr - dc, r = r0, c = c0;
  for (;;) {
    cells.push([r, c]);
    if (r === r1 && c === c1) break;
    const e2 = err + err;
    if (e2 > -dc) { err -= dc; r += sr; }
    if (e2 < dr) { err += dr; c += sc; }
  }
  return cells;
}

/* ================= 图纸绘制 ================= */
function bestAxisOffsets(total) {
  let bestOff = 0, bestDiff = Infinity;
  for (let off = 0; off < 10; off++) {
    const p5 = [], p10 = [];
    for (let p = off; p <= total; p += 5) p5.push(p);
    for (let p = off; p <= total; p += 10) p10.push(p);
    if (!p5.length || !p10.length) continue;
    const diff = Math.abs(p5[0] - (total - p5[p5.length - 1])) + Math.abs(p5[0] - (total - p10[p10.length - 1]));
    if (diff < bestDiff) { bestDiff = diff; bestOff = off; }
  }
  const pos5 = [], pos10 = [];
  for (let p = bestOff; p <= total; p += 5) pos5.push(p);
  for (let p = bestOff; p <= total; p += 10) pos10.push(p);
  return { pos5, pos10 };
}

function drawBeadPlan(grid, w, h, counts, cellSize, solid) {
  const cv = document.createElement("canvas");
  const ctx = cv.getContext("2d");
  if (solid) {
    cv.width = w * cellSize; cv.height = h * cellSize;
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const idx = grid[y * w + x];
      if (idx === -1) continue;
      ctx.fillStyle = rgbStr(MARD_COLORS[idx]);
      ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
    }
    return cv;
  }
  const totalW = w + 2, totalH = h + 2;
  const gridW = totalW * cellSize, gridH = totalH * cellSize;
  const itemW = cellSize + 80;
  let legendCols = Math.max(1, Math.floor((gridW - 20) / itemW));
  const entries = Object.keys(counts).map(k => [parseInt(k, 10), counts[k]]).sort((a, b) => b[1] - a[1]);
  legendCols = Math.min(legendCols, Math.max(1, entries.length));
  const legendRows = Math.ceil(entries.length / legendCols) || 0;
  const legendH = legendRows * (cellSize + 10) + 40;
  cv.width = gridW; cv.height = gridH + legendH;
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.textBaseline = "middle";

  const fontSmall = cellSize * 0.4 + "px 'Microsoft YaHei', sans-serif";
  const fontLegend = "12px 'Microsoft YaHei', sans-serif";
  const fontNum = "12px 'Microsoft YaHei', sans-serif";

  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const idx = grid[y * w + x];
    const left = (x + 1) * cellSize, top = (y + 1) * cellSize;
    if (idx === -1) continue;
    const color = MARD_COLORS[idx];
    ctx.fillStyle = rgbStr(color);
    ctx.fillRect(left, top, cellSize, cellSize);
    const name = MARD_NAMES[idx];
    ctx.font = fontSmall;
    ctx.fillStyle = luminance(color) > 128 ? "black" : "white";
    const tw = ctx.measureText(name).width;
    ctx.fillText(name, left + (cellSize - tw) / 2, top + cellSize / 2 + 1);
  }

  const ax = bestAxisOffsets(totalW), ay = bestAxisOffsets(totalH);
  ctx.strokeStyle = "rgb(120,120,120)";
  for (const xi of ax.pos5) {
    if (ax.pos10.includes(xi)) continue;
    ctx.lineWidth = 2; ctx.beginPath();
    ctx.moveTo(xi * cellSize, 0); ctx.lineTo(xi * cellSize, gridH); ctx.stroke();
  }
  for (const yi of ay.pos5) {
    if (ay.pos10.includes(yi)) continue;
    ctx.lineWidth = 2; ctx.beginPath();
    ctx.moveTo(0, yi * cellSize); ctx.lineTo(gridW, yi * cellSize); ctx.stroke();
  }
  ctx.lineWidth = 3;
  for (const xi of ax.pos10) { ctx.beginPath(); ctx.moveTo(xi * cellSize, 0); ctx.lineTo(xi * cellSize, gridH); ctx.stroke(); }
  for (const yi of ay.pos10) { ctx.beginPath(); ctx.moveTo(0, yi * cellSize); ctx.lineTo(gridW, yi * cellSize); ctx.stroke(); }
  ctx.strokeStyle = "rgb(120,120,120)"; ctx.lineWidth = 1;
  for (let col = 1; col < w; col++) {
    const xp = (col + 1) * cellSize;
    ctx.beginPath(); ctx.moveTo(xp, cellSize); ctx.lineTo(xp, gridH - cellSize); ctx.stroke();
  }
  for (let row = 1; row < h; row++) {
    const yp = (row + 1) * cellSize;
    ctx.beginPath(); ctx.moveTo(cellSize, yp); ctx.lineTo(gridW - cellSize, yp); ctx.stroke();
  }

  ctx.fillStyle = "black"; ctx.font = fontNum; ctx.textAlign = "center";
  for (let i = 0; i < w; i++) {
    ctx.fillText(String(i + 1), (i + 1) * cellSize + cellSize / 2, cellSize / 2 + 1);
    ctx.fillText(String(i + 1), (i + 1) * cellSize + cellSize / 2, (h + 1) * cellSize + cellSize / 2 + 1);
  }
  for (let j = 0; j < h; j++) {
    ctx.fillText(String(j + 1), cellSize / 2, (j + 1) * cellSize + cellSize / 2 + 1);
    ctx.fillText(String(j + 1), (w + 1) * cellSize + cellSize / 2, (j + 1) * cellSize + cellSize / 2 + 1);
  }
  ctx.textAlign = "left";

  let ly = gridH + 10;
  const totalBeads = entries.reduce((s, e) => s + e[1], 0);
  ctx.font = fontLegend; ctx.fillStyle = "black";
  ctx.fillText("Color Legend (MARD)", 10, ly + 8);
  const totalText = "Total: " + totalBeads;
  ctx.fillText(totalText, gridW - ctx.measureText(totalText).width - 10, ly + 8);
  ly += 20;
  for (let i = 0; i < entries.length; i++) {
    const [idx, count] = entries[i];
    const col = i % legendCols, row = Math.floor(i / legendCols);
    const xp = 10 + col * itemW, yp = ly + row * (cellSize + 10);
    const color = MARD_COLORS[idx];
    ctx.fillStyle = rgbStr(color);
    ctx.fillRect(xp, yp, cellSize, cellSize);
    ctx.font = fontLegend;
    ctx.fillStyle = luminance(color) > 128 ? "black" : "white";
    const idw = ctx.measureText(MARD_NAMES[idx]).width;
    ctx.fillText(MARD_NAMES[idx], xp + (cellSize - idw) / 2, yp + cellSize / 2 + 1);
    ctx.fillStyle = "black";
    ctx.fillText(" " + count, xp + cellSize + 5, yp + cellSize / 2 + 1);
  }
  return cv;
}

function openFileDialog() {

/* 全页面阻止浏览器默认拖拽打开行为 */
["dragenter", "dragover", "dragleave", "drop"].forEach(evt => {
  window.addEventListener(evt, e => e.preventDefault(), true);
  window.addEventListener(evt, e => e.preventDefault(), false);
});
window.addEventListener("dragover", e => {

}, false);
window.addEventListener("drop", e => {
  e.preventDefault();

  if (dt.files && dt.files.length > 0) {

  } else if (dt.types && (dt.types.includes("text/uri-list") || dt.types.includes("text/html"))) {
    setStatus("请拖拽本地图片文件，而不是网页上的图片或链接");

}, false);

$("dropZone").addEventListener("dragover", e => {

}, false);
$("dropZone").addEventListener("dragleave", e => {

}, false);
$("dropZone").addEventListener("drop", e => {

}, false);

/* 用 FileReader 读取，避免 objectURL 被提前回收 */
function loadImageFile(file) {
  if (!file) { setStatus("未获取到文件"); return; }
  if (!/^image\//.test(file.type) && !/\.(png|jpe?g|bmp|gif)$/i.test(file.name)) {
    setStatus("不支持的文件类型，请使用 png/jpg/jpeg/bmp/gif");
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      state.image = img;
      state.aspectRatio = img.naturalWidth / img.naturalHeight;
      if ($("aspectChk").checked) applyAspectRatio(true);
      const dz = $("dropZone");
      dz.innerHTML = "";
      const el = img.cloneNode();
      el.style.maxWidth = "100%"; el.style.maxHeight = "280px";
      dz.appendChild(el);
      setStatus("已加载: " + file.name);
    };
    img.onerror = () => setStatus("图片解析失败: " + file.name);
    img.src = reader.result;
  };
  reader.onerror = () => setStatus("读取文件失败: " + file.name);
  reader.readAsDataURL(file);
}

$("btnClear").addEventListener("click", () => {

/* ================= 参数联动 ================= */
function bindPair(rangeId, numId, onChange) {
  const r = $(rangeId), n = $(numId);
  r.addEventListener("input", () => { n.value = r.value; onChange(+r.value); });
  n.addEventListener("change", () => {
    let v = clamp(Math.round(+n.value || +r.min), +r.min, +r.max);
    n.value = v; r.value = v; onChange(v);
  });
}
bindPair("colorRange", "colorNum", () => {});
$("widthRange").addEventListener("input", () => { $("widthNum").value = $("widthRange").value; onWidthChange(); });
$("widthNum").addEventListener("change", () => {
  const v = clamp(Math.round(+$("widthNum").value || 10), 10, 200);
  $("widthNum").value = v; $("widthRange").value = v; onWidthChange();
});
$("heightRange").addEventListener("input", () => { $("heightNum").value = $("heightRange").value; onHeightChange(); });
$("heightNum").addEventListener("change", () => {
  const v = clamp(Math.round(+$("heightNum").value || 10), 10, 200);
  $("heightNum").value = v; $("heightRange").value = v; onHeightChange();
});
$("aspectChk").addEventListener("change", e => { if (e.target.checked && state.aspectRatio != null) applyAspectRatio(true); });

function onWidthChange() { if ($("aspectChk").checked && state.aspectRatio != null) applyAspectRatio(true); }
function onHeightChange() { if ($("aspectChk").checked && state.aspectRatio != null) applyAspectRatio(false); }

function applyAspectRatio(fromWidth) {
  if (state.aspectRatio == null) return;
  if (fromWidth) {
    const w = +$("widthRange").value;
    const h = clamp(Math.round(w / state.aspectRatio), 10, 200);
    $("heightRange").value = h; $("heightNum").value = h;
  } else {
    const h = +$("heightRange").value;
    const w = clamp(Math.round(h * state.aspectRatio), 10, 200);
    $("widthRange").value = w; $("widthNum").value = w;
  }
}

$("btnReset").addEventListener("click", () => {

  $("widthRange").value = $("widthNum").value = 40;
  $("heightRange").value = $("heightNum").value = 40;
  $("aspectChk").checked = false;
  state.originalGrid = null; state.editedHistory = [];

/* ================= 生成图纸 ================= */
$("btnGenerate").addEventListener("click", () => {
  if (!state.image) { setStatus("请先加载一张图片！"); return; }
  $("btnGenerate").disabled = true;
  setStatus("正在生成图纸，请稍候...");
  const tw = +$("widthRange").value, th = +$("heightRange").value, k = +$("colorRange").value;
  setTimeout(() => {
    try {
      const res = processImageToMard(state.image, tw, th, k);
      state.grid = res.grid; state.w = res.w; state.h = res.h; state.counts = res.counts;
      state.originalGrid = state.grid.slice();
      state.editedHistory = []; state.strokeCells = null; state.lastCell = null;
      setEditGroupEnabled(true);
      $("btnUndo").disabled = true;
      $("solidChk").checked = false; state.solid = false;
      $("previewStatus").textContent = "已生成：" + tw + " * " + th + " 格";
      $("btnSavePng").disabled = $("btnSaveTxt").disabled = $("btnPdf").disabled = $("btnSvg").disabled = $("btnPrint").disabled = false;
      $("btnSaveSolid").disabled = false;
      $("btnGenerate").disabled = false;
      $("cropInfo").textContent = "当前尺寸: " + tw + " × " + th;
      $("btnCropMode").textContent = "启用裁剪";
      $("btnMirror").disabled = false;
      refreshPreview();
      setStatus("图纸生成完成！");

      $("btnGenerate").disabled = false;
      setStatus("生成失败: " + err.message);
    }
  }, 30);
});

/* ================= 预览与缩放 ================= */
function refreshPreview() {
  if (state.grid == null || state.counts == null) return;
  const planCv = drawBeadPlan(state.grid, state.w, state.h, state.counts, CELL, state.solid);
  const out = $("plan");
  if (out.width !== planCv.width || out.height !== planCv.height) {
    out.width = planCv.width; out.height = planCv.height;
  }
  out.getContext("2d").drawImage(planCv, 0, 0);
  out.style.width = Math.max(1, planCv.width * state.zoom) + "px";
  out.style.height = Math.max(1, planCv.height * state.zoom) + "px";
}

/* 涂抹时 rAF 节流刷新：拖拽期间即可看到颜色变化 */
let editRefreshRAF = 0;
function scheduleEditRefresh() {
  if (editRefreshRAF) return;
  editRefreshRAF = requestAnimationFrame(() => {
    editRefreshRAF = 0;
    if (state.grid && state.counts) {
      state.counts = recountColors(state.grid, state.w, state.h);
      refreshPreview();
    }
  });
}

function applyZoomDisplay() {
  $("zoomRange").value = clamp(Math.round(state.zoom * 100), 30, 200);
  $("zoomLabel").textContent = Math.round(state.zoom * 100) + "%";
}
function setZoom(z) {
  state.zoom = clamp(z, 0.3, 2.0);
  applyZoomDisplay();
  if (state.grid != null && state.counts != null) refreshPreview();
}
$("btnZoomIn").addEventListener("click", () => setZoom(state.zoom + 0.1));
$("btnZoomOut").addEventListener("click", () => setZoom(state.zoom - 0.1));
$("zoomRange").addEventListener("input", e => {
  state.zoom = +e.target.value / 100;
  $("zoomLabel").textContent = e.target.value + "%";
  if (state.grid != null && state.counts != null) refreshPreview();
});
$("previewScroll").addEventListener("wheel", e => {
  e.preventDefault();
  setZoom(state.zoom + (e.deltaY < 0 ? 0.1 : -0.1));
}, { passive: false });
$("previewScroll").addEventListener("dblclick", () => setZoom(1.0));
$("solidChk").addEventListener("change", e => { state.solid = e.target.checked; refreshPreview(); });

/* ================= 鼠标坐标 -> 网格单元 ================= */
function posToCell(clientX, clientY) {
  if (state.grid == null) return null;
  const rect = $("plan").getBoundingClientRect();
  const x = clientX - rect.left, y = clientY - rect.top;
  const base = CELL * state.zoom;
  const col = Math.floor(x / base) - 1, row = Math.floor(y / base) - 1;
  if (0 <= row && row < state.h && 0 <= col && col < state.w) return [row, col];
  return null;
}

/* ================= 改色编辑 ================= */
function setEditGroupEnabled(on) {
  const g = $("editGroup");
  g.style.opacity = on ? "1" : ".5";
  g.style.pointerEvents = on ? "auto" : "none";
}
$("editModeChk").addEventListener("change", e => {
  state.editMode = e.target.checked;
  state.strokeCells = null; state.lastCell = null; state.dragStart = null;
  $("plan").style.cursor = state.editMode ? "crosshair" : "grab";
  if (state.editMode) {
    setStatus(isTouchDevice()
      ? "改色模式：单指涂抹改色，长按 0.5 秒吸取颜色，双指缩放"
      : "改色模式已开启：左键涂抹改色，右键吸取颜色");
  } else setStatus("改色模式已关闭");
});

function onTargetTextChanged(text) {
  const name = String(text || "").trim().toUpperCase();
  if (name === "[空]" || name === "") {
    state.editTargetIdx = -1;
    $("targetSwatch").style.background = "#ffffff";
    $("targetInfo").textContent = "空（无豆子）";
    return;
  }
  const idx = MARD_ID_TO_IDX[name];
  if (idx === undefined) {
    state.editTargetIdx = null;
    $("targetInfo").textContent = "未知色号，请输入合法色号（如 A1、B23、M12）";
    return;
  }
  state.editTargetIdx = idx;
  const rgb = MARD_COLORS[idx];
  $("targetSwatch").style.background = rgbStr(rgb);
  $("targetInfo").textContent = name + "  RGB(" + rgb[0] + ", " + rgb[1] + ", " + rgb[2] + ")";
}
$("targetInput").addEventListener("change", e => onTargetTextChanged(e.target.value));
$("targetInput").addEventListener("input", e => { if (MARD_ID_TO_IDX[String(e.target.value).trim().toUpperCase()] !== undefined) onTargetTextChanged(e.target.value); });

function paintCell(row, col) {
  const t = state.editTargetIdx;
  if (t === null) return;
  const i = row * state.w + col;
  const old = state.grid[i];
  if (old === t) return;
  state.grid[i] = t;
  state.strokeCells.push([row, col, old]);
  scheduleEditRefresh();
}
function paintStrokeTo(row, col) {
  if (state.lastCell == null) return;
  for (const [r, c] of lineCellsBetween(state.lastCell[0], state.lastCell[1], row, col)) paintCell(r, c);
}
function finishStroke() {
  let cells = [];
  if (state.strokeCells && state.strokeCells.length) {
    const m = new Map();
    for (const [r, c, old] of state.strokeCells) if (!m.has(r + "," + c)) m.set(r + "," + c, [r, c, old]);
    cells = [...m.values()];
    if (cells.length) state.editedHistory.push({ desc: "手动改色 " + cells.length + " 格", cells });
  }
  state.strokeCells = null; state.lastCell = null;
  afterEdit(cells.length ? "改色完成：" + cells.length + " 格" : "改色完成（无变化）");
}
function afterEdit(message) {
  state.counts = recountColors(state.grid, state.w, state.h);
  refreshPreview();
  $("btnUndo").disabled = state.editedHistory.length === 0;
  if (message) setStatus(message);
}
$("btnUndo").addEventListener("click", () => {
  if (!state.editedHistory.length) return;
  const entry = state.editedHistory.pop();
  for (const [r, c, old] of entry.cells) state.grid[r * state.w + c] = old;
  afterEdit("已撤销：" + entry.desc);
});

function pickColorFromCell(row, col) {
  const idx = state.grid[row * state.w + col];
  if (idx === -1) {
    $("targetInput").value = "[空]";
    state.editTargetIdx = -1;
    $("targetSwatch").style.background = "#ffffff";
    $("targetInfo").textContent = "空（无豆子）";
    setStatus("已吸取空颜色");
    return;
  }
  const name = MARD_NAMES[idx];
  $("targetInput").value = name;
  state.editTargetIdx = idx;
  const rgb = MARD_COLORS[idx];
  $("targetSwatch").style.background = rgbStr(rgb);
  $("targetInfo").textContent = name + "  RGB(" + rgb[0] + ", " + rgb[1] + ", " + rgb[2] + ")";
  setStatus("已吸取颜色 " + name);
}

/* ================= 裁剪 ================= */
function setCropMode(on) {
  state.cropMode = on;
  if (on) {
    if (state.editMode) { state.editMode = false; $("editModeChk").checked = false; }
    state.strokeCells = null; state.lastCell = null;
    $("plan").style.cursor = "crosshair";
    $("btnApplyCrop").style.display = "none";
    $("btnCancelCrop").style.display = "none";
    setStatus("裁剪模式：拖拽框选区域");
  } else {
    $("plan").style.cursor = state.editMode ? "crosshair" : "grab";
    cancelCrop();
    setStatus("裁剪模式已关闭");
  }
}
$("btnCropMode").addEventListener("click", () => {
  const on = !state.cropMode;
  $("btnCropMode").textContent = on ? "关闭裁剪" : "启用裁剪";
  setCropMode(on);
});
function cancelCrop() {
  const ov = $("cropOverlay");
  ov.style.display = "none"; ov.style.left = ov.style.top = ov.style.width = ov.style.height = "0px";
  state.cropRect = null; state.cropStart = null;
  $("btnApplyCrop").style.display = "none";
  $("btnCancelCrop").style.display = "none";
}
$("btnCancelCrop").addEventListener("click", cancelCrop);
$("btnApplyCrop").addEventListener("click", () => {
  if (!state.cropRect || state.grid == null) return;
  const base = CELL * state.zoom;
  const [x1, y1, x2, y2] = state.cropRect;
  const c1 = Math.floor(x1 / base) - 1, r1 = Math.floor(y1 / base) - 1;
  const c2 = Math.floor((x2 - 1) / base) - 1, r2 = Math.floor((y2 - 1) / base) - 1;
  const cl1 = clamp(Math.min(c1, c2), 0, state.w - 1), cl2 = clamp(Math.max(c1, c2), 0, state.w - 1);
  const rl1 = clamp(Math.min(r1, r2), 0, state.h - 1), rl2 = clamp(Math.max(r1, r2), 0, state.h - 1);
  const nw = cl2 - cl1 + 1, nh = rl2 - rl1 + 1;
  const ng = new Int16Array(nw * nh);
  for (let y = 0; y < nh; y++) for (let x = 0; x < nw; x++) ng[y * nw + x] = state.grid[(rl1 + y) * state.w + (cl1 + x)];
  state.grid = ng; state.w = nw; state.h = nh;
  state.originalGrid = state.grid.slice();
  state.editedHistory = [];
  $("btnUndo").disabled = true;
  state.counts = recountColors(state.grid, state.w, state.h);
  $("cropInfo").textContent = "当前尺寸: " + nw + " × " + nh;
  $("btnCropMode").textContent = "启用裁剪";
  setCropMode(false);
  refreshPreview();
  $("previewStatus").textContent = "已裁剪：" + nw + " × " + nh + " 格";
  setStatus("裁剪应用成功");
});

/* ================= 指针事件（鼠标 + 触摸通用） ================= */
const planEl = $("plan");
planEl.style.cursor = "grab";
planEl.addEventListener("contextmenu", e => e.preventDefault());

const activePointers = new Map();
let pinchState = null;
let longPressTimer = 0;
let longPressFired = false;

function cancelLongPress() {
  if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = 0; }
}
function getPointerPair() {
  const pts = [...activePointers.values()];
  return pts.length >= 2 ? [pts[0], pts[1]] : null;
}

planEl.addEventListener("pointerdown", e => {
  if (state.grid == null) return;
  try { planEl.setPointerCapture(e.pointerId); } catch (_) {}
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY, type: e.pointerType });

  /* 双指：进入缩放 */
  if (activePointers.size >= 2) {
    cancelLongPress();
    if (state.editMode && state.strokeCells && state.strokeCells.length) {
      for (const [r, c, old] of state.strokeCells) state.grid[r * state.w + c] = old;
      state.strokeCells = null; state.lastCell = null;
      scheduleEditRefresh();
    }
    state.dragging = false;
    state.cropStart = null;
    cancelCrop();
    const pair = getPointerPair();
    if (pair) {
      const dx = pair[0].x - pair[1].x, dy = pair[0].y - pair[1].y;
      pinchState = { startDist: Math.hypot(dx, dy) || 1, startZoom: state.zoom };
    }
    e.preventDefault();
    return;
  }

  /* 鼠标右键：吸色 */
  if (e.pointerType === "mouse" && e.button === 2) {
    if (state.editMode) {
      const cell = posToCell(e.clientX, e.clientY);
      if (cell) pickColorFromCell(cell[0], cell[1]);
    }
    e.preventDefault();
    return;
  }

  /* 裁剪模式 */
  if (state.cropMode) {
    if (e.button === 0) {
      const rect = planEl.getBoundingClientRect();
      state.cropStart = [e.clientX - rect.left, e.clientY - rect.top];
      const ov = $("cropOverlay");
      ov.style.display = "block";
      ov.style.left = state.cropStart[0] + "px"; ov.style.top = state.cropStart[1] + "px";
      ov.style.width = "0px"; ov.style.height = "0px";
      e.preventDefault();
    }
    return;
  }

  /* 改色模式：涂抹 + 触摸长按吸色 */
  if (state.editMode) {
    longPressFired = false;
    if (state.editTargetIdx === null) {
      setStatus("目标色号无效，请先输入合法色号");
      return;
    }
    if (e.pointerType !== "mouse") {
      const px = e.clientX, py = e.clientY;
      longPressTimer = window.setTimeout(() => {
        longPressTimer = 0;
        longPressFired = true;
        if (state.strokeCells && state.strokeCells.length) {
          for (const [r, c, old] of state.strokeCells) state.grid[r * state.w + c] = old;
          state.strokeCells = null; state.lastCell = null;
          scheduleEditRefresh();
        }
        const cell = posToCell(px, py);
        if (cell) pickColorFromCell(cell[0], cell[1]);
      }, 500);
    }
    const cell = posToCell(e.clientX, e.clientY);
    if (cell) {
      state.strokeCells = [];
      state.lastCell = cell;
      paintCell(cell[0], cell[1]);
    }
    e.preventDefault();
    return;
  }

  /* 普通模式：平移画布 */
  state.dragging = true;
  state.dragStart = [e.clientX, e.clientY];
  const sc = $("previewScroll");
  state.dragScroll = [sc.scrollLeft, sc.scrollTop];
  planEl.style.cursor = "grabbing";
  e.preventDefault();
});

planEl.addEventListener("pointermove", e => {
  if (!activePointers.has(e.pointerId)) return;
  const prev = activePointers.get(e.pointerId);
  const moved = Math.hypot(e.clientX - prev.x, e.clientY - prev.y);
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY, type: e.pointerType });
  if (longPressTimer && moved > 6) cancelLongPress();

  /* 双指缩放：只改显示尺寸，不重绘，保证流畅 */
  if (activePointers.size >= 2 && pinchState) {
    const pair = getPointerPair();
    if (pair) {
      const dx = pair[0].x - pair[1].x, dy = pair[0].y - pair[1].y;
      const dist = Math.hypot(dx, dy);
      if (dist > 0) {
        const nz = clamp(pinchState.startZoom * (dist / pinchState.startDist), 0.3, 2.0);
        state.zoom = nz;
        applyZoomDisplay();
        planEl.style.width = Math.max(1, planEl.width * nz) + "px";
        planEl.style.height = Math.max(1, planEl.height * nz) + "px";
      }
    }
    e.preventDefault();
    return;
  }

  /* 裁剪框选 */
  if (state.cropMode && state.cropStart) {
    const rect = planEl.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    const x1 = Math.min(state.cropStart[0], x), y1 = Math.min(state.cropStart[1], y);
    const w = Math.abs(x - state.cropStart[0]), h = Math.abs(y - state.cropStart[1]);
    if (w < 5 || h < 5) return;
    const ov = $("cropOverlay");
    ov.style.left = x1 + "px"; ov.style.top = y1 + "px";
    ov.style.width = w + "px"; ov.style.height = h + "px";
    state.cropRect = [x1, y1, x1 + w, y1 + h];
    return;
  }

  /* 涂抹 */
  if (state.editMode && state.strokeCells && !longPressFired) {
    const cell = posToCell(e.clientX, e.clientY);
    if (cell && (cell[0] !== state.lastCell[0] || cell[1] !== state.lastCell[1])) {
      paintStrokeTo(cell[0], cell[1]);
      state.lastCell = cell;
    }
    return;
  }

  /* 平移 */
  if (state.dragging) {
    const dx = e.clientX - state.dragStart[0], dy = e.clientY - state.dragStart[1];
    const sc = $("previewScroll");
    sc.scrollLeft = state.dragScroll[0] - dx;
    sc.scrollTop = state.dragScroll[1] - dy;
  }
});

function endPointer(e) {
  cancelLongPress();
  const wasPinching = pinchState !== null;
  activePointers.delete(e.pointerId);
  if (activePointers.size < 2) pinchState = null;
  if (wasPinching && activePointers.size === 1) activePointers.clear();
  if (wasPinching) {
    if (state.grid && state.counts) refreshPreview();  // 双指结束，重绘清晰版
  }

  if (state.cropMode && state.cropStart) {
    if (state.cropRect) {
      const w = state.cropRect[2] - state.cropRect[0], h = state.cropRect[3] - state.cropRect[1];
      if (w >= 10 && h >= 10) {
        $("btnApplyCrop").style.display = "block";
        $("btnCancelCrop").style.display = "block";
        setStatus("裁剪框已选定，点击“应用裁剪”确认");
      } else {
        cancelCrop();
        setStatus("裁剪区域太小，已取消");
      }
    } else { cancelCrop(); setStatus("裁剪区域太小，已取消"); }
    state.cropStart = null;
    return;
  }

  if (state.editMode && state.strokeCells) {
    if (longPressFired) {
      state.strokeCells = null; state.lastCell = null;
    } else {
      finishStroke();
    }
    longPressFired = false;
  }

  if (state.dragging) {
    state.dragging = false; state.dragStart = null; state.dragScroll = null;
    planEl.style.cursor = state.editMode || state.cropMode ? "crosshair" : "grab";
  }
}
planEl.addEventListener("pointerup", endPointer);
planEl.addEventListener("pointercancel", endPointer);

/* ================= 水平镜像 ================= */
$("btnMirror").addEventListener("click", () => {
  if (state.grid == null) { setStatus("请先生成图纸！"); return; }
  const ng = new Int16Array(state.w * state.h);
  for (let y = 0; y < state.h; y++) for (let x = 0; x < state.w; x++) ng[y * state.w + x] = state.grid[y * state.w + (state.w - 1 - x)];
  state.grid = ng;
  state.originalGrid = state.grid.slice();
  state.editedHistory = [];
  $("btnUndo").disabled = true;
  refreshPreview();
  setStatus("水平镜像完成");
});

/* ================= 下载辅助 ================= */
function downloadBlob(blob, filename) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 100);
}

/* ================= 保存与导出 ================= */
$("btnSavePng").addEventListener("click", () => {
  if (state.grid == null) return;
  const cv = drawBeadPlan(state.grid, state.w, state.h, state.counts, CELL, false);
  cv.toBlob(b => { downloadBlob(b, "bead_plan.png"); setStatus("已保存: bead_plan.png"); }, "image/png");
});
$("btnSaveSolid").addEventListener("click", () => {
  if (state.grid == null) return;
  const cv = drawBeadPlan(state.grid, state.w, state.h, state.counts, CELL, true);
  cv.toBlob(b => { downloadBlob(b, "bead_solid.png"); setStatus("实体图已保存: bead_solid.png"); }, "image/png");
});
$("btnSaveTxt").addEventListener("click", () => {
  if (state.counts == null) return;
  const entries = Object.keys(state.counts).map(k => [parseInt(k, 10), state.counts[k]]).sort((a, b) => b[1] - a[1]);
  const total = entries.reduce((s, e) => s + e[1], 0);
  let out = "拼豆颜色用量统计\n==================\n";
  for (const [idx, cnt] of entries) out += MARD_NAMES[idx] + ": " + cnt + " 粒\n";
  out += "\n总豆子数: " + total + " 粒";
  downloadBlob(new Blob([out], { type: "text/plain;charset=utf-8" }), "color_list.txt");
  setStatus("已保存: color_list.txt");
});

$("btnSvg").addEventListener("click", () => {
  if (state.grid == null || state.counts == null) return;
  let cellSize = CELL;
  const hw = state.h * state.w;
  if (hw > 20000) cellSize = Math.min(cellSize, 15);
  else if (hw > 10000) cellSize = Math.min(cellSize, 20);
  const w = state.w, h = state.h;
  const totalW = w + 2, totalH = h + 2;
  const gridW = totalW * cellSize, gridH = totalH * cellSize;
  const itemW = cellSize + 80;
  const entries = Object.keys(state.counts).map(k => [parseInt(k, 10), state.counts[k]]).sort((a, b) => b[1] - a[1]);
  let legendCols = Math.max(1, Math.floor((gridW - 20) / itemW));
  legendCols = Math.min(legendCols, Math.max(1, entries.length));
  const legendRows = Math.ceil(entries.length / legendCols) || 0;
  const legendH = legendRows * (cellSize + 10) + 40;
  const totalHgt = gridH + legendH;
  const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let s = '<svg xmlns="http://www.w3.org/2000/svg" width="' + gridW + '" height="' + totalHgt + '" viewBox="0 0 ' + gridW + ' ' + totalHgt + '">';
  s += '<rect x="0" y="0" width="' + gridW + '" height="' + totalHgt + '" fill="white"/>';
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const idx = state.grid[y * w + x];
    const color = MARD_COLORS[idx];
    const left = (x + 1) * cellSize, top = (y + 1) * cellSize;
    s += '<rect x="' + left + '" y="' + top + '" width="' + cellSize + '" height="' + cellSize + '" fill="rgb(' + color[0] + ',' + color[1] + ',' + color[2] + ')"/>';
    const lum = luminance(color);
    s += '<text x="' + (left + cellSize / 2) + '" y="' + (top + cellSize / 2) + '" fill="' + (lum > 128 ? 'black' : 'white') + '" font-size="' + cellSize * 0.4 + '" text-anchor="middle" dominant-baseline="central">' + esc(MARD_NAMES[idx]) + '</text>';
  }
  const ax = bestAxisOffsets(totalW), ay = bestAxisOffsets(totalH);
  for (const xi of ax.pos5) { if (ax.pos10.includes(xi)) continue; s += '<line x1="' + xi * cellSize + '" y1="0" x2="' + xi * cellSize + '" y2="' + gridH + '" stroke="rgb(200,200,200)" stroke-width="1"/>'; }
  for (const yi of ay.pos5) { if (ay.pos10.includes(yi)) continue; s += '<line x1="0" y1="' + yi * cellSize + '" x2="' + gridW + '" y2="' + yi * cellSize + '" stroke="rgb(200,200,200)" stroke-width="1"/>'; }
  for (const xi of ax.pos10) s += '<line x1="' + xi * cellSize + '" y1="0" x2="' + xi * cellSize + '" y2="' + gridH + '" stroke="rgb(120,120,120)" stroke-width="2"/>';
  for (const yi of ay.pos10) s += '<line x1="0" y1="' + yi * cellSize + '" x2="' + gridW + '" y2="' + yi * cellSize + '" stroke="rgb(120,120,120)" stroke-width="2"/>';
  const fs = cellSize * 0.45;
  for (let i = 0; i < w; i++) {
    s += '<text x="' + ((i + 1) * cellSize + cellSize / 2) + '" y="' + cellSize / 2 + '" fill="black" font-size="' + fs + '" text-anchor="middle" dominant-baseline="central">' + (i + 1) + '</text>';
    s += '<text x="' + ((i + 1) * cellSize + cellSize / 2) + '" y="' + ((h + 1) * cellSize + cellSize / 2) + '" fill="black" font-size="' + fs + '" text-anchor="middle" dominant-baseline="central">' + (i + 1) + '</text>';
  }
  for (let j = 0; j < h; j++) {
    s += '<text x="' + cellSize / 2 + '" y="' + ((j + 1) * cellSize + cellSize / 2) + '" fill="black" font-size="' + fs + '" text-anchor="middle" dominant-baseline="central">' + (j + 1) + '</text>';
    s += '<text x="' + ((w + 1) * cellSize + cellSize / 2) + '" y="' + ((j + 1) * cellSize + cellSize / 2) + '" fill="black" font-size="' + fs + '" text-anchor="middle" dominant-baseline="central">' + (j + 1) + '</text>';
  }
  let ly = gridH + 10;
  const totalBeads = entries.reduce((acc, e) => acc + e[1], 0);
  s += '<text x="10" y="' + (ly + 12) + '" fill="black" font-size="14" font-family="sans-serif">Color Legend (MARD)</text>';
  s += '<text x="' + (gridW - 10) + '" y="' + (ly + 12) + '" fill="black" font-size="14" font-family="sans-serif" text-anchor="end">Total: ' + totalBeads + '</text>';
  ly += 20;
  for (let i = 0; i < entries.length; i++) {
    const [idx, count] = entries[i];
    const col = i % legendCols, row = Math.floor(i / legendCols);
    const xp = 10 + col * itemW, yp = ly + row * (cellSize + 10);
    const color = MARD_COLORS[idx], lum = luminance(color);
    s += '<rect x="' + xp + '" y="' + yp + '" width="' + cellSize + '" height="' + cellSize + '" fill="rgb(' + color[0] + ',' + color[1] + ',' + color[2] + ')"/>';
    s += '<text x="' + (xp + cellSize / 2) + '" y="' + (yp + cellSize / 2) + '" fill="' + (lum > 128 ? 'black' : 'white') + '" font-size="' + cellSize * 0.4 + '" text-anchor="middle" dominant-baseline="central">' + esc(MARD_NAMES[idx]) + '</text>';
    s += '<text x="' + (xp + cellSize + 5) + '" y="' + (yp + cellSize / 2) + '" fill="black" font-size="' + cellSize * 0.4 + '" dominant-baseline="central">: ' + count + '</text>';
  }
  s += '</svg>';
  downloadBlob(new Blob([s], { type: "image/svg+xml;charset=utf-8" }), "bead_plan.svg");
  setStatus("SVG 已导出: bead_plan.svg");
});

function printPlan(isPdf) {
  if (state.grid == null || state.counts == null) return;
  const cv = drawBeadPlan(state.grid, state.w, state.h, state.counts, CELL, false);
  const win = window.open("", "_blank");
  if (!win) { setStatus("弹窗被浏览器拦截，请允许弹窗后重试"); return; }
  const note = isPdf ? "<p style='font-family:sans-serif'>在打印对话框的“目标打印机”中选择 <b>另存为 PDF</b> 即可导出 PDF 文件。</p>" : "";
  win.document.write("<!DOCTYPE html><html><head><meta charset='utf-8'><title>ChromaBead 图纸</title></head><body style='margin:0;text-align:center'><img src='" + cv.toDataURL("image/png") + "' style='max-width:100%'/>" + note + "</body></html>");
  win.document.close();
  win.focus();
  setTimeout(() => { win.print(); setStatus(isPdf ? "已打开打印窗口，请选择“另存为 PDF”" : "打印完成"); }, 400);
}
$("btnPdf").addEventListener("click", () => printPlan(true));
$("btnPrint").addEventListener("click", () => printPlan(false));

/* ================= 初始化 ================= */
(function init() {
  const dl = $("mardIds");
  let opts = "<option value=\"[空]\"></option>";
  for (const d of MARD221_FULL) opts += '<option value="' + d[0] + '"></option>';
  dl.innerHTML = opts;
  onTargetTextChanged("[空]");
  setEditGroupEnabled(false);
  setStatus(isTouchDevice()
    ? "就绪（触摸：单指涂抹，长按吸色，双指缩放）"
    : "就绪");
})();
</script>
